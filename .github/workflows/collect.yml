name: collect

on:
  schedule:
    - cron: "2-59/5 * * * *"   # every 5 minutes (GitHub may delay runs a few minutes at busy times)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and build
        run: |
          python collect.py
          python build.py
      - name: Commit
        run: |
          git config user.name "lev-tracker-bot"
          git config user.email "lev-tracker-bot@users.noreply.github.com"
          git add -A data README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "snapshot $(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
