name: collect

on:
  schedule:
    - cron: "4-59/5 * * * *"   # wake every 5 min (~6 min before each :x0/:x5 start); gate.py decides whether to collect
  repository_dispatch:       # external 5-minute tick (cron-job.org), gated like the schedule
    types: [tick]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Gate (pre-show or half-hourly)
        id: gate
        run: python3 gate.py
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.collect == 'true'
        with:
          python-version: "3.12"
      - name: Collect and build
        if: steps.gate.outputs.collect == 'true'
        run: |
          python collect.py
          python build.py
      - name: Commit
        if: steps.gate.outputs.collect == 'true'
        run: |
          git config user.name "lev-tracker-bot"
          git config user.email "lev-tracker-bot@users.noreply.github.com"
          git add -A data README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "snapshot $(TZ=Asia/Jerusalem date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
          exit 1
